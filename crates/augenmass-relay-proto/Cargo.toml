[package]
name = "augenmass-relay-proto"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "Shared wire protocol for the Augenmass Workbench hosted relay."

[lib]
name = "augenmass_relay_proto"
path = "src/lib.rs"

[dependencies]
base64 = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
