[package]
name = "augenmass-workbench"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "Augenmass Workbench: a swiss-army CLI and Claude Code skill for the EUDI Wallet ecosystem (inspect, decode, audit over-ask, verify, generate, repair)."
repository = "https://github.com/augenmass/augenmass-workbench"

[[bin]]
name = "augenmass"
path = "src/main.rs"

[lib]
name = "augenmass_workbench"
path = "src/lib.rs"

[dependencies]
augenmass-core = { path = "crates/augenmass-core" }
openid4vp = { git = "https://github.com/spruceid/openid4vp", rev = "d2847dfcd07d1ea70ffc0c713ad650519d424a82" }
ssi = { version = "0.16", features = ["secp256r1"] }
anyhow = "1"
axum = { version = "0.7", features = ["macros"] }
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
qrcode = "0.14"
rand = "0.8"
rcgen = "0.13"
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
p256 = { version = "0.13", features = ["jwk", "ecdsa", "pem", "pkcs8"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
x509-cert = "0.2.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
