name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: augenmass
            package_ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            binary: augenmass
            package_ext: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            binary: augenmass
            package_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: augenmass.exe
            package_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
          rustup target add ${{ matrix.target }}

      - name: Check tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            awk -F '=' '
              $1 ~ /^[[:space:]]*version[[:space:]]*$/ {
                gsub(/[[:space:]"]/, "", $2);
                print $2;
                exit;
              }
            ' Cargo.toml
          )"
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}; expected ${expected}" >&2
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="$(./scripts/package-release-archive.sh "${{ matrix.target }}" "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.package_ext }}" dist)"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Smoke packaged archive
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/release-archive-smoke.sh "${{ steps.package.outputs.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: augenmass-${{ matrix.target }}
          path: |
            dist/*${{ matrix.package_ext }}
            dist/*${{ matrix.package_ext }}.sha256
            dist/*${{ matrix.package_ext }}.manifest.json

  publish:
    name: publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
