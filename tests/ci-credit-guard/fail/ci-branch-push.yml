name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  native:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - runner: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - run: cargo test --workspace
